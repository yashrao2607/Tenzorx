version: '3.8'

services:
  db:
    image: postgres:15
    container_name: mediroute_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mediroute
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build: ./mediroute-backend
    ports:
      - "8000:8000"
    env_file:
      - ./mediroute-backend/.env
    depends_on:
      - db
    restart: always

  frontend:
    build: ./mediroute-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
