name: MediRoute CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd mediroute-backend
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: |
          cd mediroute-backend
          # pytest # Assuming tests will be added

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd mediroute-frontend
          npm install
      - name: Build
        run: |
          cd mediroute-frontend
          npm run build

  docker-build:
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend Image
        run: docker build ./mediroute-backend -t mediroute-backend:latest
      - name: Build Frontend Image
        run: docker build ./mediroute-frontend -t mediroute-frontend:latest
